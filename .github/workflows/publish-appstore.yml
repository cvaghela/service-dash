# Publishes the ZimaOS/CasaOS app-store source in appstore/ as a subscribable
# store. The built dist/ lands on the gh-pages branch, and jsDelivr serves it
# straight from there -- GitHub Pages itself does not need to be enabled.
#
# Users subscribe to:
#   https://cdn.jsdelivr.net/gh/cvaghela/service-dash@gh-pages/store.json
#
# The same branch carries the public demo at /demo/, built from the real
# index.html, styles.css and app.js with stand-in backends in front.
name: Publish store and demo

on:
  # No tag trigger: a tag push carries no appstore/** change of its own, so the
  # paths filter would drop it. The release commit that bumps the app version in
  # appstore/Apps/ServiceDash/docker-compose.yml is what republishes the store.
  push:
    branches:
      - main
    paths:
      - "appstore/**"
      - "demo/**"
      # The demo inlines these three verbatim, so it goes stale without them.
      - "index.html"
      - "assets/css/styles.css"
      - "assets/js/app.js"
      - ".github/workflows/publish-appstore.yml"
  pull_request:
    paths:
      - "appstore/**"
      - "demo/**"
      - "index.html"
      - "assets/css/styles.css"
      - "assets/js/app.js"
      - ".github/workflows/publish-appstore.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-appstore
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build store dist
        uses: IceWhaleTech/build-appstore-action@v1
        with:
          source: appstore
          output: dist
          base-url: https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages
          report-json: out/build-report.json

      # A second copy, built for the GitHub Pages mirror. It cannot share the
      # first: the paths inside the generated files are root-relative and are
      # joined onto the baked-in base_url, so a client that fetched the store
      # from Pages would still be sent to jsDelivr for the compose file and
      # assets -- which is precisely the copy that goes stale. Two base-urls
      # means two builds.
      #
      # It lands at dist/pages/, so Pages serves it from /service-dash/pages/.
      - name: Build the Pages mirror
        uses: IceWhaleTech/build-appstore-action@v1
        with:
          source: appstore
          output: dist/pages
          base-url: https://cvaghela.github.io/service-dash/pages

      - name: Build the public demo
        run: |
          python3 demo/build-demo.py --out dist/demo/index.html
          # A demo whose stylesheet or script silently went missing still
          # renders something, so check the three inlined sources are in there.
          # -F -- because one needle starts with dashes and would otherwise be
          # read as an option, failing the build on a demo that is perfectly fine.
          for needle in '--accent' 'function saveSettings' 'Stand-in backends'; do
            grep -qF -- "$needle" dist/demo/index.html \
              || { echo "::error::demo is missing '$needle' -- build-demo.py needs updating"; exit 1; }
          done

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appstore-build-report
          path: out/build-report.json
          if-no-files-found: ignore

      - name: Show generated store index
        run: |
          echo "--- store.json ---"
          cat dist/store.json
          echo "--- index.json ---"
          cat dist/index.json

      # Only main and tags publish. Pull requests stop at the build above, so a
      # broken store source fails review rather than the live store.
      - name: Deploy dist to gh-pages
        id: deploy
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist
          # Deliberately NOT force_orphan. Rewriting gh-pages history on every
          # deploy leaves jsDelivr's @gh-pages ref resolution pinned to a commit
          # that no longer exists on the branch, and it then serves that content
          # indefinitely -- purging a path does not invalidate a stuck ref. The
          # symptom is a store that is correct on gh-pages and stale for users.

      # jsDelivr serves a @branch URL with s-maxage=43200, so without this the
      # store keeps handing users the previous release for up to 12 hours after
      # gh-pages already has the new one. Purge the metadata files by name --
      # assets are content-addressed by the build and change name when they
      # change, so they do not need it.
      #
      # Then check every one of them, rather than trusting the purge. Two ways
      # this has already gone wrong: a purge reported "finished" and left the
      # edge stale because it re-fetched before GitHub had propagated the push,
      # and files expire independently -- meta.json came good while store.json
      # stayed stale, so checking a single canary reported success while users
      # were still being served an old catalogue.
      - name: Purge the jsDelivr cache and confirm every file took
        if: github.event_name != 'pull_request'
        run: |
          cdn="https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages"
          purge="https://purge.jsdelivr.net/gh/${{ github.repository }}@gh-pages"
          cd dist

          # -path prune: dist/pages/ is the Pages mirror, served by Pages and
          # not by jsDelivr, so it has no cache to purge.
          stale=$(find . -path ./pages -prune -o \( -name '*.json' -o -name '*.yml' -o -name 'metadata.*' \) -print \
                  | sed 's|^\./||' | sort)
          echo "checking $(echo "$stale" | wc -l | tr -d ' ') metadata files"

          for attempt in 1 2 3 4 5; do
            echo "-- attempt $attempt: waiting for the push to propagate"
            sleep $((attempt * 15))

            for path in $stale; do
              curl -sS --retry 2 --retry-delay 3 -o /dev/null "$purge/$path" || true
            done
            sleep 10

            next=""
            for path in $stale; do
              want=$(sha256sum "$path" | cut -d' ' -f1)
              got=$(curl -sSL "$cdn/$path" | sha256sum | cut -d' ' -f1)
              [ "$want" = "$got" ] || next="$next $path"
            done

            stale=$(printf '%s' "$next" | tr ' ' '\n' | sed '/^$/d')
            if [ -z "$stale" ]; then
              echo "::notice::jsDelivr is serving the new store in full (attempt $attempt)."
              exit 0
            fi
            echo "   still stale: $(printf '%s' "$stale" | tr '\n' ' ')"
          done

          echo "::warning::jsDelivr is still serving stale store metadata for:"
          for path in $stale; do echo "::warning::  $path"; done
          echo "::warning::gh-pages is correct -- the CDN should catch up within 12 hours."
          echo "::warning::If this persists, check that the deploy step is not rewriting gh-pages history."
