name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# NOTE: every job name below is a REQUIRED STATUS CHECK in the repository's
# "Protect main" ruleset -- "Checks" plus one "Build <image> (<arch>)" per
# combination. Renaming a job, or adding an image or architecture, orphans a
# context: GitHub then waits forever for a status that will never be reported
# and every pull request blocks with "Expected -- Waiting for status to be
# reported". That happened when this file was split into per-architecture
# builds. Change a name here and update the ruleset in the same breath
# (Settings -> Rules -> Protect main), or the next PR cannot merge.

jobs:
  # The static checks do not depend on any image, so they run once rather than
  # once per image per architecture.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # check-service-additions.py compares against the previous release
          # tag, so a shallow clone would have nothing to compare against.
          fetch-depth: 0

      - name: Validate configuration and scripts
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.casaos.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
          # The app-store copy is what ZimaOS users install, and the store's own
          # CI gates on exactly this command.
          docker compose -f appstore/Apps/ServiceDash/docker-compose.yml config --quiet
          node --check assets/js/app.js
          node --check kuma-auth/server.js
          sh -n entrypoint.sh
          sh -n install-linux.sh
          sh -n network-info.sh
          sh -n claude-usage.sh
          sh -n codex-usage.sh

      - name: Check nginx upstreams are reachable from the dashboard
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-compose-networks.py

      - name: Reporter regression tests
        run: sh scripts/test-reporters.sh

      - name: Check a new service is not shipped without an upgrade path
        run: python3 scripts/check-service-additions.py

      - name: Check the empty state can still explain itself
        run: python3 scripts/check-empty-state.py

      - name: Check each image claims only its own digests
        run: python3 scripts/check-publish-matrix.py

      - name: Check the release version is stated consistently
        run: python3 scripts/check-release.py

  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.arch }})
    # Each architecture builds on a runner of that architecture, and there is
    # no QEMU here at all. Emulating arm64 on an amd64 runner produced
    # intermittent `exit code: 132` -- SIGILL, logged as "qemu: uncaught target
    # signal 4 (Illegal instruction) - core dumped" -- part way through
    # `npm install` in the two reporter images. It reads like a dependency
    # failure and is nothing of the kind; it is the emulator, it struck roughly
    # one build in three, and re-running was the only remedy. Native runners
    # remove the cause and are faster besides.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image:
          - { name: service-dash, dockerfile: Dockerfile }
          - { name: service-dash-network-info, dockerfile: Dockerfile.network-info }
          - { name: service-dash-kuma-auth, dockerfile: Dockerfile.kuma-auth }
          - { name: service-dash-claude-usage, dockerfile: Dockerfile.claude-usage }
          - { name: service-dash-codex-usage, dockerfile: Dockerfile.codex-usage }
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: false
