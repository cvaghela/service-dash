name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: service-dash
            dockerfile: Dockerfile
          - image: service-dash-network-info
            dockerfile: Dockerfile.network-info
          - image: service-dash-kuma-auth
            dockerfile: Dockerfile.kuma-auth
          - image: service-dash-claude-usage
            dockerfile: Dockerfile.claude-usage
          - image: service-dash-codex-usage
            dockerfile: Dockerfile.codex-usage

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # check-service-additions.py compares against the previous release
          # tag, so a shallow clone would have nothing to compare against.
          fetch-depth: 0

      - name: Validate configuration and scripts
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.casaos.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
          # The app-store copy is what ZimaOS users install, and the store's own
          # CI gates on exactly this command.
          docker compose -f appstore/Apps/ServiceDash/docker-compose.yml config --quiet
          node --check assets/js/app.js
          node --check kuma-auth/server.js
          sh -n entrypoint.sh
          sh -n install-linux.sh
          sh -n network-info.sh
          sh -n claude-usage.sh
          sh -n codex-usage.sh

      - name: Check nginx upstreams are reachable from the dashboard
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-compose-networks.py

      - name: Check a new service is not shipped without an upgrade path
        run: python3 scripts/check-service-additions.py

      - name: Check the release version is stated consistently
        run: python3 scripts/check-release.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
