      de_DE: |
        ### Vor der Installation

        Service Dash liest Ihre Monitore aus **Uptime Kuma**. Es installiert Kuma
        nicht für Sie, richten Sie das also zuerst ein:

        1. Installieren Sie **Uptime Kuma** -- es liegt im offiziellen ZimaOS App
           Store -- und belassen Sie es auf dem Standardport `3001`. Wenn Sie einen anderen Port
           verwenden, passen Sie unten `KUMA_PORT` und `KUMA_URL` am Dienst
           `kuma-auth` entsprechend an. Kuma muss auf demselben Host laufen.
        2. Legen Sie in Uptime Kuma eine **Statusseite** an und fügen Sie die
           Monitore hinzu, die auf dem Dashboard erscheinen sollen.
        3. Notieren Sie den **Slug** der Statusseite -- den letzten Teil ihrer URL.
           Lautet er nicht `homelab`, passen Sie unten `STATUS_SLUG` an.

        ### Lokale und öffentliche URL auf einer Karte

        Beide Adressen kommen aus Uptime Kuma, und zwar daraus, **wie Sie die
        Monitore benennen**. Geben Sie einem Dienst zwei Monitore:

        | Monitorname | Zeigt auf | Erscheint auf der Karte als |
        | --- | --- | --- |
        | `Plex` | Ihre öffentliche URL | **External** |
        | `Plex local` | Ihre LAN-URL | **Local** |

        Service Dash fasst sie anhand des Namens zu einer Karte mit beiden
        Adressen zusammen. `Plex (local)`, `Plex - local` und `Plex.local` werden
        genauso erkannt. Ein Dienst mit nur einem Monitor zeigt einfach eine
        Adresse.

        Jede Adresse ist die URL des Monitors in Kuma, sie wird also in Kuma
        gesetzt, nicht hier. Das Dashboard öffnet die Adresse, die Ihr Browser
        tatsächlich erreichen kann -- die lokale im LAN, die öffentliche
        außerhalb -- pro Karte entschieden und ohne irgendetwas zu testen. Der
        Schalter in der oberen Leiste legt sie auf **Local** oder **External**
        fest, wenn Sie lieber selbst wählen.

        Beide Adressen zeigen **URL Locked**, bis Sie sich vom Dashboard aus bei
        Uptime Kuma anmelden -- abgemeldet werden sie überhaupt nicht an den
        Browser gesendet.

        Öffnen Sie Service Dash dann auf Port **8888**.
      el_GR: |
        ### Πριν την εγκατάσταση

        Το Service Dash διαβάζει τα monitors σας από το **Uptime Kuma**. Δεν
        εγκαθιστά το Kuma για εσάς, οπότε ρυθμίστε το πρώτα:

        1. Εγκαταστήστε το **Uptime Kuma** -- βρίσκεται στο επίσημο app store του
           ZimaOS -- και αφήστε το στην προεπιλεγμένη θύρα `3001`. Αν το τρέχετε σε άλλη θύρα,
           αλλάξτε παρακάτω το `KUMA_PORT` και το `KUMA_URL` στην υπηρεσία
           `kuma-auth` ώστε να ταιριάζουν. Το Kuma πρέπει να βρίσκεται στον ίδιο
           host.
        2. Στο Uptime Kuma, δημιουργήστε μια **σελίδα κατάστασης** και προσθέστε τα
           monitors που θέλετε στον πίνακα.
        3. Σημειώστε το **slug** της σελίδας κατάστασης -- το τελευταίο τμήμα της
           URL της. Αν δεν είναι `homelab`, αλλάξτε παρακάτω το `STATUS_SLUG`.

        ### Τοπική και δημόσια διεύθυνση σε μία κάρτα

        Και οι δύο διευθύνσεις προέρχονται από το Uptime Kuma, από **τον τρόπο που
        ονομάζετε τα monitors**. Δώστε σε μια υπηρεσία δύο monitors:

        | Όνομα monitor | Δείχνει σε | Εμφανίζεται στην κάρτα ως |
        | --- | --- | --- |
        | `Plex` | τη δημόσια URL σας | **External** |
        | `Plex local` | την URL του LAN σας | **Local** |

        Το Service Dash τα ζευγαρώνει με βάση το όνομα σε μία κάρτα που τις έχει
        και τις δύο. Τα `Plex (local)`, `Plex - local` και `Plex.local`
        αναγνωρίζονται με τον ίδιο τρόπο. Μια υπηρεσία με ένα μόνο monitor απλώς
        δείχνει μία διεύθυνση.

        Κάθε διεύθυνση είναι η URL του ίδιου του monitor στο Kuma, άρα ορίζεται
        εκεί, όχι εδώ. Ο πίνακας ανοίγει όποια διεύθυνση μπορεί πράγματι να
        προσεγγίσει ο browser σας -- την τοπική όταν είστε στο LAN, τη δημόσια
        όταν δεν είστε -- αποφασίζοντας ανά κάρτα και χωρίς να δοκιμάζει τίποτα.
        Ο διακόπτης στην επάνω μπάρα τον καρφιτσώνει σε **Local** ή **External**
        αν προτιμάτε να επιλέγετε εσείς.

        Και οι δύο διευθύνσεις δείχνουν **URL Locked** μέχρι να συνδεθείτε στο
        Uptime Kuma από τον πίνακα -- αποσυνδεδεμένες, δεν στέλνονται καθόλου
        στον browser.

        Στη συνέχεια ανοίξτε το Service Dash στη θύρα **8888**.
      fr_FR: |
        ### Avant d'installer

        Service Dash lit vos moniteurs depuis **Uptime Kuma**. Il n'installe pas
        Kuma pour vous, commencez donc par le mettre en place :

        1. Installez **Uptime Kuma** -- il est dans la boutique officielle ZimaOS --
           et laissez-le sur son port par défaut `3001`. Si vous l'exécutez sur un autre
           port, modifiez `KUMA_PORT` ci-dessous et `KUMA_URL` sur le service
           `kuma-auth` en conséquence. Kuma doit être sur ce même hôte.
        2. Dans Uptime Kuma, créez une **page de statut** et ajoutez-y les
           moniteurs que vous voulez sur le tableau de bord.
        3. Notez le **slug** de la page de statut -- la dernière partie de son URL.
           S'il n'est pas `homelab`, modifiez `STATUS_SLUG` ci-dessous.

        ### Obtenir l'URL locale et publique sur une seule carte

        Les deux adresses viennent d'Uptime Kuma, et précisément de **la façon
        dont vous nommez les moniteurs**. Donnez deux moniteurs à un service :

        | Nom du moniteur | Pointe vers | Apparaît sur la carte comme |
        | --- | --- | --- |
        | `Plex` | votre URL publique | **External** |
        | `Plex local` | votre URL LAN | **Local** |

        Service Dash les apparie par leur nom en une seule carte portant les deux.
        `Plex (local)`, `Plex - local` et `Plex.local` sont reconnus de la même
        manière. Un service n'ayant qu'un seul moniteur affiche simplement une
        adresse.

        Chaque adresse est l'URL du moniteur dans Kuma : elle se règle donc dans
        Kuma, pas ici. Le tableau de bord ouvre l'adresse que votre navigateur
        peut réellement atteindre -- la locale sur le LAN, la publique ailleurs --
        en décidant carte par carte et sans rien tester. Le sélecteur de la barre
        supérieure la fixe sur **Local** ou **External** si vous préférez choisir
        vous-même.

        Les deux adresses affichent **URL Locked** tant que vous ne vous êtes pas
        connecté à Uptime Kuma depuis le tableau de bord -- déconnecté, elles ne
        sont jamais envoyées au navigateur.

        Ouvrez ensuite Service Dash sur le port **8888**.
      hr_HR: |
        ### Prije instalacije

        Service Dash čita vaše monitore iz **Uptime Kume**. Ne instalira Kumu
        umjesto vas, pa to postavite prvo:

        1. Instalirajte **Uptime Kuma** -- nalazi se u službenoj ZimaOS trgovini
           aplikacija -- i ostavite ga na zadanom portu `3001`. Ako ga pokrećete na drugom
           portu, promijenite `KUMA_PORT` niže i `KUMA_URL` na usluzi `kuma-auth`
           da odgovaraju. Kuma mora biti na istom poslužitelju.
        2. U Uptime Kumi izradite **stranicu stanja** i dodajte monitore koje
           želite na nadzornoj ploči.
        3. Zabilježite **slug** stranice stanja -- posljednji dio njezina URL-a.
           Ako nije `homelab`, promijenite `STATUS_SLUG` niže.

        ### Lokalni i javni URL na jednoj kartici

        Obje adrese dolaze iz Uptime Kume, i to iz **načina na koji imenujete
        monitore**. Dajte usluzi dva monitora:

        | Naziv monitora | Pokazuje na | Na kartici se prikazuje kao |
        | --- | --- | --- |
        | `Plex` | vaš javni URL | **External** |
        | `Plex local` | vaš LAN URL | **Local** |

        Service Dash ih po nazivu spaja u jednu karticu koja nosi obje. `Plex
        (local)`, `Plex - local` i `Plex.local` prepoznaju se jednako. Usluga sa
        samo jednim monitorom jednostavno prikazuje jednu adresu.

        Svaka je adresa vlastiti URL monitora u Kumi, pa se postavlja u Kumi, a ne
        ovdje. Nadzorna ploča otvara onu adresu do koje vaš preglednik doista može
        doći -- lokalnu kad ste na LAN-u, javnu kad niste -- odlučujući po kartici
        i bez ikakvog testiranja. Prekidač u gornjoj traci fiksira je na **Local**
        ili **External** ako radije birate sami.

        Obje adrese prikazuju **URL Locked** dok se s nadzorne ploče ne prijavite
        u Uptime Kumu -- dok ste odjavljeni, uopće se ne šalju pregledniku.

        Zatim otvorite Service Dash na portu **8888**.
      it_IT: |
        ### Prima di installare

        Service Dash legge i vostri monitor da **Uptime Kuma**. Non installa Kuma
        al posto vostro, quindi predisponetelo prima:

        1. Installate **Uptime Kuma** -- si trova nell'app store ufficiale di ZimaOS
           -- e lasciatelo sulla porta predefinita `3001`. Se lo eseguite su un'altra
           porta, modificate `KUMA_PORT` qui sotto e `KUMA_URL` sul servizio
           `kuma-auth` di conseguenza. Kuma deve stare su questo stesso host.
        2. In Uptime Kuma create una **pagina di stato** e aggiungete i monitor che
           volete sulla dashboard.
        3. Annotate lo **slug** della pagina di stato -- l'ultima parte del suo URL.
           Se non è `homelab`, modificate `STATUS_SLUG` qui sotto.

        ### Ottenere URL locale e pubblico su un'unica scheda

        Entrambi gli indirizzi vengono da Uptime Kuma, e precisamente da **come
        nominate i monitor**. Date a un servizio due monitor:

        | Nome del monitor | Punta a | Sulla scheda appare come |
        | --- | --- | --- |
        | `Plex` | il vostro URL pubblico | **External** |
        | `Plex local` | il vostro URL LAN | **Local** |

        Service Dash li abbina per nome in un'unica scheda che li porta entrambi.
        `Plex (local)`, `Plex - local` e `Plex.local` sono riconosciuti allo
        stesso modo. Un servizio con un solo monitor mostra semplicemente un
        indirizzo.

        Ogni indirizzo è l'URL del monitor stesso in Kuma, quindi si imposta in
        Kuma, non qui. La dashboard apre l'indirizzo che il vostro browser può
        davvero raggiungere -- quello locale quando siete sulla LAN, quello
        pubblico quando non lo siete -- decidendo scheda per scheda e senza
        provare nulla. Il selettore nella barra in alto lo fissa su **Local** o
        **External** se preferite scegliere voi.

        Entrambi gli indirizzi mostrano **URL Locked** finché non accedete a
        Uptime Kuma dalla dashboard -- da disconnessi non vengono mai inviati al
        browser.

        Aprite poi Service Dash sulla porta **8888**.
      ja_JP: |
        ### インストールの前に

        Service Dash は監視項目を **Uptime Kuma** から読み取ります。Kuma を代わりに
        インストールすることはないので、先に用意してください。

        1. **Uptime Kuma** をインストールします。ZimaOS の公式アプリストアにあります。
           ポートは既定の `3001` のままにしてください。 別のポートで動かす場合は、下の
           `KUMA_PORT` と `kuma-auth` サービスの `KUMA_URL` を合わせて変更して
           ください。Kuma は同じホスト上にある必要があります。
        2. Uptime Kuma で**ステータスページ**を作成し、ダッシュボードに出したい
           監視項目を追加します。
        3. ステータスページの **slug** (URL の末尾) を控えます。`homelab` でない
           場合は、下の `STATUS_SLUG` を合わせて変更してください。

        ### ローカル URL と公開 URL を 1 枚のカードにまとめる

        どちらのアドレスも Uptime Kuma から来ます。決め手は**監視項目の名前の
        付け方**です。1 つのサービスに監視項目を 2 つ用意してください。

        | 監視項目の名前 | 指す先 | カードでの表示 |
        | --- | --- | --- |
        | `Plex` | 公開 URL | **External** |
        | `Plex local` | LAN の URL | **Local** |

        Service Dash は名前で 2 つを組にして、両方を持つ 1 枚のカードにします。
        `Plex (local)`、`Plex - local`、`Plex.local` も同じように認識されます。
        監視項目が 1 つだけのサービスは、アドレスを 1 つだけ表示します。

        各アドレスは Kuma 上の監視項目そのものの URL なので、設定するのは Kuma
        側であり、ここではありません。ダッシュボードは、ブラウザーが実際に到達
        できるほうのアドレスを開きます。LAN 内ならローカル、そうでなければ公開
        アドレスを、カードごとに判断し、通信テストは一切行いません。上部バーの
        スイッチを使えば、**Local** または **External** に固定できます。

        ダッシュボードから Uptime Kuma にサインインするまで、どちらのアドレスも
        **URL Locked** と表示されます。サインアウト中は、そもそもブラウザーに
        送られません。

        準備ができたら、ポート **8888** で Service Dash を開いてください。
      ko_KR: |
        ### 설치하기 전에

        Service Dash는 모니터 목록을 **Uptime Kuma**에서 읽어 옵니다. Kuma를 대신
        설치해 주지는 않으니 먼저 준비하세요.

        1. **Uptime Kuma**를 설치하세요. ZimaOS 공식 앱 스토어에 있습니다.
           포트는 기본값 `3001` 그대로 두세요. 다른 포트로 실행한다면 아래의
           `KUMA_PORT`와 `kuma-auth` 서비스의 `KUMA_URL`을 맞춰 변경하세요. Kuma는
           같은 호스트에 있어야 합니다.
        2. Uptime Kuma에서 **상태 페이지**를 만들고 대시보드에 띄우고 싶은 모니터를
           추가하세요.
        3. 상태 페이지의 **slug**(URL의 마지막 부분)를 확인하세요. `homelab`이
           아니라면 아래 `STATUS_SLUG`를 맞춰 바꾸세요.

        ### 로컬 URL과 공개 URL을 한 카드에 담기

        두 주소 모두 Uptime Kuma에서 오며, 기준은 **모니터 이름을 짓는 방식**입니다.
        한 서비스에 모니터를 두 개 만드세요.

        | 모니터 이름 | 가리키는 곳 | 카드에서 표시되는 이름 |
        | --- | --- | --- |
        | `Plex` | 공개 URL | **External** |
        | `Plex local` | LAN URL | **Local** |

        Service Dash는 이름을 기준으로 둘을 묶어 두 주소를 모두 담은 카드 하나로
        만듭니다. `Plex (local)`, `Plex - local`, `Plex.local`도 똑같이 인식합니다.
        모니터가 하나뿐인 서비스는 주소도 하나만 보여 줍니다.

        각 주소는 Kuma에 있는 모니터 자체의 URL이므로, 여기가 아니라 Kuma에서
        설정합니다. 대시보드는 브라우저가 실제로 닿을 수 있는 주소를 엽니다. LAN
        안에서는 로컬, 밖에서는 공개 주소를 카드마다 판단하며, 아무것도 시험 삼아
        접속해 보지 않습니다. 직접 고르고 싶다면 상단 바의 스위치로 **Local** 또는
        **External**에 고정할 수 있습니다.

        대시보드에서 Uptime Kuma에 로그인하기 전까지 두 주소는 모두 **URL Locked**로
        표시됩니다. 로그아웃 상태에서는 브라우저로 아예 전송되지 않습니다.

        그런 다음 포트 **8888**에서 Service Dash를 여세요.
      nb_NO: |
        ### Før du installerer

        Service Dash leser overvåkerne dine fra **Uptime Kuma**. Det installerer
        ikke Kuma for deg, så sett opp det først:

        1. Installer **Uptime Kuma** -- det ligger i den offisielle ZimaOS-appbutikken
           -- og la det stå på standardporten `3001`. Kjører du det på en annen port,
           endrer du `KUMA_PORT` nedenfor og `KUMA_URL` på tjenesten `kuma-auth`
           tilsvarende. Kuma må ligge på samme vert.
        2. Opprett en **statusside** i Uptime Kuma og legg til overvåkerne du vil ha
           på dashbordet.
        3. Noter statussidens **slug** -- den siste delen av URL-en. Er den ikke
           `homelab`, endrer du `STATUS_SLUG` nedenfor.

        ### Lokal og offentlig URL på ett kort

        Begge adressene kommer fra Uptime Kuma, nærmere bestemt fra **hvordan du
        navngir overvåkerne**. Gi en tjeneste to overvåkere:

        | Overvåkernavn | Peker på | Vises på kortet som |
        | --- | --- | --- |
        | `Plex` | din offentlige URL | **External** |
        | `Plex local` | din LAN-URL | **Local** |

        Service Dash parer dem etter navn til ett kort som bærer begge. `Plex
        (local)`, `Plex - local` og `Plex.local` gjenkjennes på samme måte. En
        tjeneste med bare én overvåker viser rett og slett én adresse.

        Hver adresse er overvåkerens egen URL i Kuma, så den settes i Kuma, ikke
        her. Dashbordet åpner den adressen nettleseren din faktisk når fram til --
        den lokale når du er på LAN, den offentlige når du ikke er det -- avgjort
        per kort og uten å teste noe som helst. Bryteren i topplinjen låser den til
        **Local** eller **External** om du heller vil velge selv.

        Begge adressene viser **URL Locked** til du logger inn på Uptime Kuma fra
        dashbordet -- utlogget sendes de aldri til nettleseren i det hele tatt.

        Åpne så Service Dash på port **8888**.
      pt_PT: |
        ### Antes de instalar

        O Service Dash lê os seus monitores a partir do **Uptime Kuma**. Não
        instala o Kuma por si, portanto trate disso primeiro:

        1. Instale o **Uptime Kuma** -- está na loja de aplicações oficial do ZimaOS
           -- e deixe-o na porta predefinida `3001`. Se o executar noutra porta,
           altere `KUMA_PORT` abaixo e `KUMA_URL` no serviço `kuma-auth` em
           conformidade. O Kuma tem de estar neste mesmo anfitrião.
        2. No Uptime Kuma, crie uma **página de estado** e adicione os monitores que
           quer ver no painel.
        3. Anote o **slug** da página de estado -- a última parte do seu URL. Se não
           for `homelab`, altere `STATUS_SLUG` abaixo.

        ### Obter o URL local e o público num só cartão

        Ambos os endereços vêm do Uptime Kuma, mais concretamente de **como nomeia
        os monitores**. Dê dois monitores a um serviço:

        | Nome do monitor | Aponta para | Aparece no cartão como |
        | --- | --- | --- |
        | `Plex` | o seu URL público | **External** |
        | `Plex local` | o seu URL da LAN | **Local** |

        O Service Dash emparelha-os pelo nome num único cartão com ambos. `Plex
        (local)`, `Plex - local` e `Plex.local` são reconhecidos da mesma forma. Um
        serviço com apenas um monitor mostra simplesmente um endereço.

        Cada endereço é o URL do próprio monitor no Kuma, por isso define-se no
        Kuma e não aqui. O painel abre o endereço que o seu navegador consegue
        realmente alcançar -- o local quando está na LAN, o público quando não está
        -- decidindo cartão a cartão e sem testar nada. O seletor da barra superior
        fixa-o em **Local** ou **External** se preferir escolher.

        Ambos os endereços mostram **URL Locked** até iniciar sessão no Uptime Kuma
        a partir do painel -- com a sessão terminada, nunca chegam a ser enviados
        para o navegador.

        Depois abra o Service Dash na porta **8888**.
      ru_RU: |
        ### Перед установкой

        Service Dash читает ваши мониторы из **Uptime Kuma**. Сам Kuma он не
        устанавливает, поэтому сначала настройте его:

        1. Установите **Uptime Kuma** -- он есть в официальном магазине приложений
           ZimaOS -- и оставьте порт по умолчанию `3001`. Если вы запускаете его на другом
           порту, измените `KUMA_PORT` ниже и `KUMA_URL` у сервиса `kuma-auth`
           соответственно. Kuma должен быть на том же хосте.
        2. В Uptime Kuma создайте **страницу состояния** и добавьте мониторы,
           которые хотите видеть на панели.
        3. Запомните **slug** страницы состояния -- последнюю часть её адреса. Если
           это не `homelab`, измените `STATUS_SLUG` ниже.

        ### Локальный и публичный адрес на одной карточке

        Оба адреса берутся из Uptime Kuma, а именно из того, **как вы называете
        мониторы**. Заведите для сервиса два монитора:

        | Имя монитора | Указывает на | На карточке отображается как |
        | --- | --- | --- |
        | `Plex` | ваш публичный URL | **External** |
        | `Plex local` | ваш URL в локальной сети | **Local** |

        Service Dash связывает их по имени в одну карточку с двумя адресами.
        `Plex (local)`, `Plex - local` и `Plex.local` распознаются так же. Сервис
        с единственным монитором просто показывает один адрес.

        Каждый адрес -- это собственный URL монитора в Kuma, то есть задаётся он в
        Kuma, а не здесь. Панель открывает тот адрес, до которого ваш браузер
        действительно дотянется: локальный в домашней сети, публичный за её
        пределами. Решение принимается для каждой карточки и без каких-либо
        проверок соединения. Переключатель в верхней панели закрепляет выбор на
        **Local** или **External**, если вы предпочитаете решать сами.

        Оба адреса показывают **URL Locked**, пока вы не войдёте в Uptime Kuma из
        панели: без входа они вообще не отправляются в браузер.

        После этого откройте Service Dash на порту **8888**.
      sv_SE: |
        ### Innan du installerar

        Service Dash läser dina övervakare från **Uptime Kuma**. Det installerar
        inte Kuma åt dig, så sätt upp det först:

        1. Installera **Uptime Kuma** -- det finns i den officiella ZimaOS-appbutiken
           -- och låt det ligga kvar på standardporten `3001`. Kör du det på en annan port
           ändrar du `KUMA_PORT` nedan och `KUMA_URL` på tjänsten `kuma-auth` så att
           de stämmer. Kuma måste ligga på samma värd.
        2. Skapa en **statussida** i Uptime Kuma och lägg till de övervakare du vill
           ha på instrumentpanelen.
        3. Notera statussidans **slug** -- sista delen av dess URL. Är den inte
           `homelab` ändrar du `STATUS_SLUG` nedan.

        ### Lokal och publik URL på ett kort

        Båda adresserna kommer från Uptime Kuma, närmare bestämt från **hur du
        namnger övervakarna**. Ge en tjänst två övervakare:

        | Övervakarens namn | Pekar på | Visas på kortet som |
        | --- | --- | --- |
        | `Plex` | din publika URL | **External** |
        | `Plex local` | din LAN-URL | **Local** |

        Service Dash parar ihop dem efter namn till ett kort som bär båda. `Plex
        (local)`, `Plex - local` och `Plex.local` känns igen på samma sätt. En
        tjänst med bara en övervakare visar helt enkelt en adress.

        Varje adress är övervakarens egen URL i Kuma, så den ställs in i Kuma och
        inte här. Instrumentpanelen öppnar den adress din webbläsare faktiskt når
        -- den lokala när du är på LAN, den publika när du inte är det -- avgjort
        per kort och utan att testa någonting. Växeln i toppraden låser den till
        **Local** eller **External** om du hellre väljer själv.

        Båda adresserna visar **URL Locked** tills du loggar in på Uptime Kuma från
        instrumentpanelen -- utloggad skickas de aldrig till webbläsaren alls.

        Öppna sedan Service Dash på port **8888**.
      tr_TR: |
        ### Kurmadan önce

        Service Dash, izleyicilerinizi **Uptime Kuma**'dan okur. Kuma'yı sizin
        yerinize kurmaz, bu yüzden önce onu hazırlayın:

        1. **Uptime Kuma**'yı kurun -- resmi ZimaOS uygulama mağazasında bulunur --
           ve varsayılan `3001` portunda bırakın. Başka bir portta çalıştırıyorsanız
           aşağıdaki `KUMA_PORT` değerini ve `kuma-auth` servisindeki `KUMA_URL`
           değerini buna göre değiştirin. Kuma bu aynı ana makinede olmalıdır.
        2. Uptime Kuma'da bir **durum sayfası** oluşturun ve panoda görmek
           istediğiniz izleyicileri ekleyin.
        3. Durum sayfasının **slug** değerini -- URL'sinin son bölümünü -- not edin.
           `homelab` değilse aşağıdaki `STATUS_SLUG` değerini buna göre değiştirin.

        ### Yerel ve genel URL'yi tek kartta toplamak

        Her iki adres de Uptime Kuma'dan gelir; belirleyici olan **izleyicileri
        nasıl adlandırdığınızdır**. Bir servise iki izleyici tanımlayın:

        | İzleyici adı | Şuna işaret eder | Kartta şöyle görünür |
        | --- | --- | --- |
        | `Plex` | genel URL'niz | **External** |
        | `Plex local` | yerel ağ URL'niz | **Local** |

        Service Dash bunları ada göre eşleştirip ikisini birden taşıyan tek bir
        kart yapar. `Plex (local)`, `Plex - local` ve `Plex.local` da aynı şekilde
        tanınır. Yalnızca tek izleyicisi olan bir servis basitçe tek adres gösterir.

        Her adres, izleyicinin Kuma'daki kendi URL'sidir; yani burada değil,
        Kuma'da ayarlanır. Pano, tarayıcınızın gerçekten ulaşabildiği adresi açar
        -- yerel ağdayken yereli, dışarıdayken geneli -- kararı kart bazında verir
        ve hiçbir bağlantı denemesi yapmaz. Kendiniz seçmeyi tercih ederseniz üst
        çubuktaki anahtar bunu **Local** ya da **External** olarak sabitler.

        Panodan Uptime Kuma'ya giriş yapana dek her iki adres de **URL Locked**
        görünür; oturum kapalıyken tarayıcıya hiç gönderilmezler.

        Ardından Service Dash'i **8888** portundan açın.
      zh_CN: |
        ### 安装之前

        Service Dash 从 **Uptime Kuma** 读取你的监控项。它不会替你安装 Kuma，所以
        请先把 Kuma 准备好：

        1. 安装 **Uptime Kuma**——它在 ZimaOS 官方应用商店里——并保持它的默认端口
           `3001` 不变。 如果你把它跑在别的端口上，请把下面的
           `KUMA_PORT` 和 `kuma-auth` 服务上的 `KUMA_URL` 一并改成对应的值。Kuma
           必须和本应用在同一台主机上。
        2. 在 Uptime Kuma 中创建一个**状态页**，把你想显示在仪表盘上的监控项加进去。
        3. 记下状态页的 **slug**，也就是它网址的最后一段。如果不是 `homelab`，请把
           下面的 `STATUS_SLUG` 改成一致。

        ### 让内网地址和公网地址出现在同一张卡片上

        两个地址都来自 Uptime Kuma，取决于**你如何给监控项命名**。给一个服务建两个
        监控项：

        | 监控项名称 | 指向 | 在卡片上显示为 |
        | --- | --- | --- |
        | `Plex` | 你的公网地址 | **External** |
        | `Plex local` | 你的局域网地址 | **Local** |

        Service Dash 会按名称把它们配成一对，合成一张同时带两个地址的卡片。
        `Plex (local)`、`Plex - local` 和 `Plex.local` 同样能被识别。只有一个监控项
        的服务，就只显示一个地址。

        每个地址就是该监控项在 Kuma 里自己的 URL，所以要在 Kuma 里设置，而不是在这里。
        仪表盘会打开你的浏览器真正能访问到的那个地址——在局域网内用内网地址，不在时用
        公网地址——逐张卡片判断，并且不做任何探测。如果你更想自己选，顶栏的开关可以把
        它固定为 **Local** 或 **External**。

        在你从仪表盘登录 Uptime Kuma 之前，两个地址都显示为 **URL Locked**；未登录
        时，它们根本不会被发送到浏览器。

        然后在 **8888** 端口打开 Service Dash。
  release_notes:
    en_US: |
      1.5.5 takes the Docker socket away from the metrics agent.

      Netdata mounted the Docker socket directly, which grants the whole Docker API.
      Mounting it read-only restricts the mount, not the API. Netdata needs Docker for
      one thing only: turning a container id into a name for the per-container charts.

      It now asks CetusGuard for that single lookup instead, on an allowlist that
      answers container inspection and refuses everything else. Nothing changes on
      screen -- container names and per-card CPU and memory work exactly as before.

      **Updating in the store will not apply this.** A CasaOS app update rewrites image
      tags and leaves the rest of the Compose file alone, so an existing install keeps
      the old socket mount. Reinstall the app, or make the change by hand -- the
      README's "Upgrading from 1.5.4" section gives the exact lines.
    en_GB: |
      1.5.5 takes the Docker socket away from the metrics agent.

      Netdata mounted the Docker socket directly, which grants the whole Docker API.
      Mounting it read-only restricts the mount, not the API. Netdata needs Docker for
      one thing only: turning a container id into a name for the per-container charts.

      It now asks CetusGuard for that single lookup instead, on an allowlist that
      answers container inspection and refuses everything else. Nothing changes on
      screen -- container names and per-card CPU and memory behave exactly as before.

      **Updating in the store will not apply this.** A CasaOS app update rewrites image
      tags and leaves the rest of the Compose file alone, so an existing installation
      keeps the old socket mount. Reinstall the app, or make the change by hand -- the
      README's "Upgrading from 1.5.4" section gives the exact lines.
    de_DE: |
      1.5.5 nimmt dem Metrik-Agenten den Docker-Socket weg.

      Netdata hat den Docker-Socket direkt eingebunden, was Zugriff auf die komplette
      Docker-API bedeutet. Ein Einbinden als read-only beschränkt die Einbindung, nicht
      die API. Netdata braucht Docker für genau eine Sache: aus einer Container-ID
      einen Namen für die Container-Diagramme zu machen.

      Diese eine Abfrage läuft jetzt über CetusGuard, mit einer Freigabeliste, die nur
      das Abfragen eines Containers erlaubt und alles andere ablehnt. Auf dem Bildschirm
      ändert sich nichts -- Container-Namen sowie CPU und Speicher pro Karte
      funktionieren genau wie vorher.

      **Ein Update im Store übernimmt das nicht.** Ein CasaOS-App-Update schreibt nur
      die Image-Tags neu und lässt den Rest der Compose-Datei unverändert, eine
      bestehende Installation behält also die alte Socket-Einbindung. Installiere die
      App neu oder nimm die Änderung selbst vor -- der Abschnitt "Upgrading from 1.5.4"
      in der README nennt die genauen Zeilen.
    el_GR: |
      Η 1.5.5 αφαιρεί το Docker socket από τον πράκτορα μετρήσεων.

      Το Netdata προσάρτηζε το Docker socket απευθείας, κάτι που δίνει πρόσβαση σε
      ολόκληρο το Docker API. Η προσάρτηση ως read-only περιορίζει την προσάρτηση, όχι
      το API. Το Netdata χρειάζεται το Docker για ένα μόνο πράγμα: να μετατρέπει ένα
      container id σε όνομα για τα γραφήματα ανά container.

      Τώρα ζητά αυτή τη μία αναζήτηση από το CetusGuard, με μια λίστα που επιτρέπει
      μόνο την επιθεώρηση ενός container και απορρίπτει όλα τα άλλα. Στην οθόνη δεν
      αλλάζει τίποτα -- τα ονόματα των containers και η CPU και η μνήμη ανά κάρτα
      δουλεύουν όπως πριν.

      **Η ενημέρωση από το store δεν το εφαρμόζει αυτό.** Μια ενημέρωση εφαρμογής CasaOS
      ξαναγράφει μόνο τα image tags και αφήνει το υπόλοιπο αρχείο Compose ως είναι, οπότε
      μια υπάρχουσα εγκατάσταση κρατά την παλιά προσάρτηση. Εγκατέστησε ξανά την
      εφαρμογή ή κάνε την αλλαγή με το χέρι -- η ενότητα "Upgrading from 1.5.4" στο
      README δίνει τις ακριβείς γραμμές.
    fr_FR: |
      La 1.5.5 retire le socket Docker à l'agent de métriques.

      Netdata montait le socket Docker directement, ce qui donne accès à toute l'API
      Docker. Le monter en read-only restreint le montage, pas l'API. Netdata n'a
      besoin de Docker que pour une chose : transformer un id de conteneur en nom pour
      les graphiques par conteneur.

      Cette seule requête passe désormais par CetusGuard, avec une liste
      d'autorisations qui répond à l'inspection d'un conteneur et refuse tout le reste.
      Rien ne change à l'écran -- les noms de conteneurs ainsi que le CPU et la mémoire
      par carte fonctionnent exactement comme avant.

      **Mettre à jour depuis le store n'appliquera pas ce changement.** Une mise à jour
      d'application CasaOS réécrit les tags d'images et laisse le reste du fichier
      Compose tel quel : une installation existante conserve donc l'ancien montage.
      Réinstalle l'application ou fais la modification à la main -- la section
      "Upgrading from 1.5.4" du README donne les lignes exactes.
    hr_HR: |
      1.5.5 uzima Docker socket agentu za metrike.

      Netdata je Docker socket montirao izravno, što daje pristup cijelom Docker API-ju.
      Montiranje kao read-only ograničava montiranje, a ne API. Netdata treba Docker
      samo za jedno: pretvoriti id kontejnera u naziv za grafikone po kontejneru.

      Taj jedan upit sada ide preko CetusGuarda, uz listu dopuštenja koja odgovara na
      pregled jednog kontejnera i odbija sve ostalo. Na zaslonu se ništa ne mijenja --
      nazivi kontejnera te CPU i memorija po kartici rade kao i prije.

      **Ažuriranje u storeu ovo neće primijeniti.** CasaOS ažuriranje aplikacije
      prepisuje samo image tagove i ostavlja ostatak Compose datoteke nedirnutim, pa
      postojeća instalacija zadržava staro montiranje. Ponovno instaliraj aplikaciju
      ili izmjenu napravi ručno -- odjeljak "Upgrading from 1.5.4" u README-u navodi
      točne linije.
    it_IT: |
      La 1.5.5 toglie il socket Docker all'agente delle metriche.

      Netdata montava il socket Docker direttamente, il che concede tutta l'API Docker.
      Montarlo in read-only limita il montaggio, non l'API. Netdata ha bisogno di
      Docker per una cosa sola: trasformare un id di container in un nome per i grafici
      per container.

      Ora chiede quella singola ricerca a CetusGuard, con una lista di autorizzazioni
      che risponde all'ispezione di un container e rifiuta tutto il resto. Sullo
      schermo non cambia nulla -- i nomi dei container e CPU e memoria per scheda
      funzionano esattamente come prima.

      **L'aggiornamento dallo store non applicherà questa modifica.** Un aggiornamento
      di app CasaOS riscrive i tag delle immagini e lascia invariato il resto del file
      Compose, quindi un'installazione esistente conserva il vecchio montaggio.
      Reinstalla l'app oppure applica la modifica a mano -- la sezione "Upgrading from
      1.5.4" del README indica le righe esatte.
    ja_JP: |
      1.5.5 はメトリクスエージェントから Docker ソケットを取り上げます。

      Netdata は Docker ソケットを直接マウントしていました。これは Docker API 全体への
      アクセスを与えるものです。read-only でマウントしてもマウントが読み取り専用になる
      だけで、API は制限されません。Netdata が Docker を必要とするのは 1 点だけで、
      コンテナ ID をコンテナ別グラフ用の名前に変換するためです。

      その 1 回の問い合わせは、コンテナの照会だけに応答しそれ以外をすべて拒否する
      許可リストを通して、CetusGuard に行くようになりました。画面上の表示は変わりません
      -- コンテナ名、カードごとの CPU とメモリは以前とまったく同じように動きます。

      **ストアからの更新ではこの変更は適用されません。** CasaOS のアプリ更新はイメージ
      タグを書き換えるだけで Compose ファイルの残りはそのままなので、既存のインストール
      は古いマウントを保持します。アプリを再インストールするか、手作業で変更してください
      -- README の "Upgrading from 1.5.4" の節に正確な行が載っています。
    ko_KR: |
      1.5.5는 메트릭 에이전트에서 Docker 소켓을 회수합니다.

      Netdata는 Docker 소켓을 직접 마운트했는데, 이는 Docker API 전체를 허용하는 것입니다.
      read-only로 마운트해도 마운트만 읽기 전용이 되고 API는 제한되지 않습니다. Netdata가
      Docker를 필요로 하는 것은 단 하나, 컨테이너 id를 컨테이너별 차트용 이름으로 바꾸는
      일입니다.

      이제 그 한 번의 조회를 CetusGuard에 요청하며, 허용 목록은 컨테이너 조회에만 응답하고
      나머지는 모두 거부합니다. 화면에서 달라지는 것은 없습니다 -- 컨테이너 이름과 카드별
      CPU, 메모리는 이전과 똑같이 동작합니다.

      **스토어에서 업데이트해도 이 변경은 적용되지 않습니다.** CasaOS 앱 업데이트는 이미지
      태그만 다시 쓰고 Compose 파일의 나머지는 그대로 두므로, 기존 설치는 예전 마운트를
      유지합니다. 앱을 다시 설치하거나 직접 수정하세요 -- README의 "Upgrading from 1.5.4"
      절에 정확한 줄이 나와 있습니다.
    nb_NO: |
      1.5.5 tar Docker-socketen fra metrikkagenten.

      Netdata monterte Docker-socketen direkte, noe som gir tilgang til hele
      Docker-API-et. Å montere den read-only begrenser monteringen, ikke API-et.
      Netdata trenger Docker til én ting: å gjøre en container-id om til et navn i
      diagrammene per container.

      Det ene oppslaget går nå gjennom CetusGuard, med en tillatelsesliste som svarer
      på oppslag av én container og avviser alt annet. Ingenting endrer seg på skjermen
      -- containernavn og CPU og minne per kort virker akkurat som før.

      **En oppdatering i butikken vil ikke ta i bruk dette.** En CasaOS-appoppdatering
      skriver om image-tagger og lar resten av Compose-filen være, så en eksisterende
      installasjon beholder den gamle monteringen. Installer appen på nytt, eller gjør
      endringen selv -- avsnittet "Upgrading from 1.5.4" i README-en gir de nøyaktige
      linjene.
    pt_PT: |
      A 1.5.5 retira o socket Docker ao agente de métricas.

      O Netdata montava o socket Docker diretamente, o que dá acesso a toda a API do
      Docker. Montá-lo como read-only restringe a montagem, não a API. O Netdata só
      precisa do Docker para uma coisa: transformar um id de contentor num nome para os
      gráficos por contentor.

      Essa única consulta passa agora pelo CetusGuard, com uma lista de permissões que
      responde à inspeção de um contentor e recusa tudo o resto. No ecrã nada muda --
      os nomes dos contentores e o CPU e a memória por cartão funcionam exatamente como
      antes.

      **Atualizar na loja não aplica esta alteração.** Uma atualização de aplicação
      CasaOS reescreve as tags das imagens e deixa o resto do ficheiro Compose
      intacto, pelo que uma instalação existente mantém a montagem antiga. Reinstala a
      aplicação ou faz a alteração à mão -- a secção "Upgrading from 1.5.4" do README
      indica as linhas exatas.
    ru_RU: |
      1.5.5 забирает Docker-сокет у агента метрик.

      Netdata монтировал Docker-сокет напрямую, а это доступ ко всему Docker API.
      Монтирование как read-only ограничивает монтирование, а не API. Docker нужен
      Netdata только для одного: превратить id контейнера в имя для графиков по
      контейнерам.

      Теперь этот единственный запрос идёт через CetusGuard, со списком разрешений,
      который отвечает на запрос одного контейнера и отклоняет всё остальное. На экране
      ничего не меняется -- имена контейнеров, а также CPU и память на карточку
      работают точно так же, как раньше.

      **Обновление в магазине это не применит.** Обновление приложения CasaOS
      перезаписывает только теги образов и оставляет остальной файл Compose без
      изменений, поэтому существующая установка сохраняет старое монтирование.
      Переустановите приложение или внесите изменение вручную -- раздел "Upgrading from
      1.5.4" в README приводит точные строки.
    sv_SE: |
      1.5.5 tar Docker-socketen från metrikagenten.

      Netdata monterade Docker-socketen direkt, vilket ger tillgång till hela
      Docker-API:et. Att montera den read-only begränsar monteringen, inte API:et.
      Netdata behöver Docker till en enda sak: att göra ett container-id till ett namn
      i diagrammen per container.

      Den enda uppslagningen går nu via CetusGuard, med en tillåtelselista som svarar
      på uppslagning av en container och avvisar allt annat. Ingenting ändras på
      skärmen -- containernamn samt CPU och minne per kort fungerar precis som förut.

      **En uppdatering i butiken tillämpar inte detta.** En CasaOS-appuppdatering
      skriver om image-taggar och lämnar resten av Compose-filen orörd, så en
      befintlig installation behåller den gamla monteringen. Installera om appen eller
      gör ändringen för hand -- avsnittet "Upgrading from 1.5.4" i README anger de
      exakta raderna.
    tr_TR: |
      1.5.5, Docker socket'ini metrik ajanından geri alıyor.

      Netdata, Docker socket'ini doğrudan bağlıyordu; bu da Docker API'sinin tamamına
      erişim demek. Onu read-only bağlamak bağlamayı kısıtlar, API'yi değil. Netdata'nın
      Docker'a tek bir şey için ihtiyacı var: konteyner id'sini, konteyner başına
      grafikler için bir isme dönüştürmek.

      Bu tek sorgu artık CetusGuard üzerinden gidiyor; izin listesi yalnızca tek bir
      konteynerin incelenmesine yanıt veriyor, geri kalan her şeyi reddediyor. Ekranda
      hiçbir şey değişmiyor -- konteyner adları ile kart başına CPU ve bellek tam olarak
      eskisi gibi çalışıyor.

      **Mağazadan güncellemek bunu uygulamaz.** CasaOS uygulama güncellemesi yalnızca
      image etiketlerini yeniden yazar ve Compose dosyasının kalanına dokunmaz; mevcut
      bir kurulum eski bağlamayı korur. Uygulamayı yeniden kurun ya da değişikliği elle
      yapın -- README'deki "Upgrading from 1.5.4" bölümü tam satırları veriyor.
    zh_CN: |
      1.5.5 把 Docker socket 从指标代理手里收回。

      Netdata 之前直接挂载 Docker socket，而那等于开放整个 Docker API。以 read-only 挂载
      限制的是挂载本身，不是 API。Netdata 需要 Docker 只为一件事：把容器 id 变成按容器
      图表上的名字。

      现在这一次查询改为经由 CetusGuard，其放行清单只回应对单个容器的查询，其余一律拒绝。
      界面上没有任何变化 -- 容器名称以及每张卡片的 CPU 和内存都和以前完全一样。

      **在应用商店里更新不会应用这项改动。** CasaOS 的应用更新只会重写镜像标签，Compose
      文件的其余部分保持原样，因此已有的安装会保留旧的挂载。请重新安装应用，或手动修改
      -- README 中 "Upgrading from 1.5.4" 一节给出了确切的行。
