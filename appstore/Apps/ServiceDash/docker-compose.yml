name: service-dash

services:
  service-dash:
    image: ghcr.io/cvaghela/service-dash:1.5.1
    container_name: service-dash
    ports:
      - target: 80
        published: "8888"
        protocol: tcp
    environment:
      # The port Uptime Kuma listens on, on this host.
      KUMA_PORT: "3001"
      # The slug of the Uptime Kuma status page to read monitors from.
      STATUS_SLUG: "homelab"
      STORAGE_MOUNT: "auto"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - netdata
      - docker-metadata
      - network-info
      - kuma-auth
    volumes:
      - type: bind
        source: /DATA/AppData/service-dash/network-info
        target: /var/run/network-info
        read_only: true
      # Written by the optional claude-usage reporter. Absent unless that
      # profile is running, which nginx handles by 404ing the route.
      - type: bind
        source: /DATA/AppData/service-dash/ai-usage
        target: /var/run/ai-usage
        read_only: true
      # Holds shared card settings. Only written when SHARED_SETTINGS is "on".
      - type: bind
        source: /DATA/AppData/service-dash/settings
        target: /var/lib/service-dash
    networks:
      service-dash-network:
        aliases:
          - service-dash
    restart: unless-stopped
    # Service-level x-casaos is legacy: the v2 build strips it. It is kept for
    # the official store, which still packages a v1 main.zip for older clients,
    # and it documents the three settings worth changing at install time.
    x-casaos:
      envs:
        - container: KUMA_PORT
          description:
            en_US: The port Uptime Kuma listens on, on this host. Default 3001.
        - container: STATUS_SLUG
          description:
            en_US: The slug of the Uptime Kuma status page to read monitors from.
        - container: STORAGE_MOUNT
          description:
            en_US: Which filesystem the storage gauge reports. "auto" picks the largest data mount.

  # Answers one question for nginx: is this browser really signed in to Uptime
  # Kuma? Without it, saving settings would have to trust the browser's word.
  kuma-auth:
    image: ghcr.io/cvaghela/service-dash-kuma-auth:1.5.1
    container_name: service-dash-kuma-auth
    environment:
      # Must point at the same Uptime Kuma as KUMA_PORT above.
      KUMA_URL: "http://host.docker.internal:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Must share a network with service-dash: nginx reaches this by service name.
    networks:
      service-dash-network:
        aliases:
          - kuma-auth
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:2371/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  network-info:
    image: ghcr.io/cvaghela/service-dash-network-info:1.5.1
    container_name: service-dash-network-info
    network_mode: host
    read_only: true
    environment:
      # Starting value only -- the dashboard's settings page overrides it.
      NETWORK_INFO_REFRESH_SECONDS: "600"
    volumes:
      - type: bind
        source: /DATA/AppData/service-dash/network-info
        target: /status
      # Read-only: the refresh interval is set on the dashboard's settings page.
      - type: bind
        source: /DATA/AppData/service-dash/settings
        target: /settings
        read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "test", "-s", "/status/status.json"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  docker-metadata:
    image: ghcr.io/hectorm/cetusguard:v1
    container_name: service-dash-docker-metadata
    read_only: true
    environment:
      CETUSGUARD_BACKEND_ADDR: unix:///var/run/docker.sock
      CETUSGUARD_FRONTEND_ADDR: tcp://0.0.0.0:2375
      # Read-only, and only the two network endpoints the dashboard needs.
      CETUSGUARD_RULES: |
        GET %API_PREFIX_NETWORKS%(\?.*)?
        GET %API_PREFIX_NETWORKS%/%NETWORK_ID_OR_NAME%(\?.*)?
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      service-dash-network:
        aliases:
          - docker-metadata
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  netdata:
    image: netdata/netdata:stable
    container_name: service-dash-netdata
    pid: host
    environment:
      DISABLE_TELEMETRY: "1"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - /DATA/AppData/service-dash/netdata/config:/etc/netdata
      - /DATA/AppData/service-dash/netdata/lib:/var/lib/netdata
      - /DATA/AppData/service-dash/netdata/cache:/var/cache/netdata
      # The whole host root, read-only. Binding only /DATA here left Netdata
      # unable to walk the host's mount table, so its disk collector reported
      # the container's own root and nothing else -- which is why the storage
      # picker offered a single "/" on ZimaOS. Netdata reads sizes, it never
      # writes, and rslave keeps later host mounts visible.
      - /:/host/root:ro,rslave
      - /etc/hostname:/host/etc/hostname:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/dbus:/run/dbus:ro
    networks:
      service-dash-network:
        aliases:
          - netdata
    restart: unless-stopped

  # Reports your Claude plan usage to the dashboard panel.
  #
  # Runs always, and does nothing until you sign in: with no credential it
  # writes an honest "nobody has signed in yet" document, the panel stays
  # hidden, and it costs about 6MB of RAM and no measurable CPU.
  #
  # It used to sit behind a Compose profile so it started for nobody. That was
  # the wrong mechanism: a CasaOS app update rewrites image tags but does NOT
  # add services a release introduced, so profile-gated services never reached
  # anyone upgrading -- and the enable command the settings page printed found
  # nothing to start. Shipping it present-but-idle makes "enable" a sign-in.
  #
  # The trade is the image size, which is large because it carries Claude Code.
  # `docker compose stop claude-usage` if you never want it.
  #
  #   docker exec -it service-dash-claude-usage claude auth login
  claude-usage:
    image: ghcr.io/cvaghela/service-dash-claude-usage:1.5.1
    container_name: service-dash-claude-usage
    environment:
      # Plan windows move slowly; polling harder gains nothing.
      CLAUDE_USAGE_REFRESH_SECONDS: "300"
    volumes:
      - type: bind
        source: /DATA/AppData/service-dash/ai-usage
        target: /status
      # The login. Without this a container rebuild signs you out.
      - type: bind
        source: /DATA/AppData/service-dash/claude-auth
        target: /root/.claude
    networks:
      service-dash-network:
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Reports your Codex plan usage to the dashboard panel. Same deal as
  # claude-usage above: always present, idle until you sign in.
  #
  # One-time sign-in, after starting it. --device-auth is not optional in a
  # container: the default flow opens a browser at the container's own
  # localhost and hangs.
  #   docker exec -it service-dash-codex-usage codex login --device-auth
  codex-usage:
    image: ghcr.io/cvaghela/service-dash-codex-usage:1.5.1
    container_name: service-dash-codex-usage
    environment:
      CODEX_USAGE_REFRESH_SECONDS: "300"
    volumes:
      - type: bind
        source: /DATA/AppData/service-dash/ai-usage
        target: /status
      - type: bind
        source: /DATA/AppData/service-dash/codex-auth
        target: /root/.codex
    networks:
      service-dash-network:
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  service-dash-network:
    name: service-dash-network
    driver: bridge

x-casaos:
  id: io.github.cvaghela.servicedash
  main: service-dash
  index: /
  port_map: "8888"
  scheme: http
  category: Networking
  architectures:
    - amd64
    - arm64
  version: "1.5.1"
  update_at: "2026-08-29"
  author: Chintan Vaghela
  developer: Chintan Vaghela
  icon: https://cdn.jsdelivr.net/gh/cvaghela/service-dash@main/appstore/Apps/ServiceDash/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/cvaghela/service-dash@main/appstore/Apps/ServiceDash/thumbnail.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/cvaghela/service-dash@main/appstore/Apps/ServiceDash/screenshot-1.jpg
    - https://cdn.jsdelivr.net/gh/cvaghela/service-dash@main/appstore/Apps/ServiceDash/screenshot-2.jpg
    - https://cdn.jsdelivr.net/gh/cvaghela/service-dash@main/appstore/Apps/ServiceDash/screenshot-3.jpg
  website: https://github.com/cvaghela/service-dash
  repo: https://github.com/cvaghela/service-dash
  docs: https://github.com/cvaghela/service-dash#readme
  support: https://github.com/cvaghela/service-dash/issues
  title:
    en_US: Service Dash
  tagline:
    en_US: Every service's local and public URL on one card, beside the live health of the box running them.
  description:
    en_US: |
      Service Dash turns an existing Uptime Kuma status page into a homelab
      dashboard. Each service gets one card carrying both of its addresses --
      the internal (local) URL you use at home and the external (public) URL you
      use away from it -- so you open either one without keeping a second
      bookmark list. Each card opens whichever address the browser you are
      holding can actually reach -- LAN at home, public when you are out --
      decided per card, with a manual switch still there if you want it.

      The pairing comes from Uptime Kuma itself: two monitors named `Plex` and
      `Plex local` become one card with two addresses. Nothing to configure --
      name the monitors that way and the card builds itself.

      Alongside the cards, an embedded Netdata Agent reports the health of the
      host itself: CPU, RAM, storage and live network throughput, plus the
      LAN and WAN addresses of the machine, detected automatically.

      **What it does**

      - Local and public URLs on one card, opening whichever one you can reach
      - Live up/down state pulled straight from your Uptime Kuma status page
      - Host CPU, RAM, storage and network throughput from a bundled Netdata Agent
      - Around 2,900 service icons, searchable, or paste an image link
      - Per-card icon and Docker container mapping, shared across every browser
      - A shared notes panel, gated behind your Uptime Kuma sign-in
      - Addresses stay locked signed out, and unreadable until pointed at signed in
      - Optional: how much of your Claude or ChatGPT plan is left, on the wall
      - No build step, no account, no telemetry -- static files behind nginx

      **Requires an Uptime Kuma instance already running on this host.** See the
      installation tips before installing.

      **Learn more:** [Service Dash on GitHub](https://github.com/cvaghela/service-dash)
  tips:
    before_install:
      en_US: |
        ### Before you install

        Service Dash reads your monitors from **Uptime Kuma**. It does not
        install Kuma for you, so set that up first:

        1. Install **Uptime Kuma** -- it is in the official ZimaOS app store --
           and leave it on its default port `3001`. If you run it on another
           port, change `KUMA_PORT` below and `KUMA_URL` on the `kuma-auth`
           service to match. Kuma must be on this same host.
        2. In Uptime Kuma, create a **status page** and add the monitors you
           want on the dashboard.
        3. Note the status page's **slug** -- the last part of its URL. If it is
           not `homelab`, change `STATUS_SLUG` below to match.

        ### Getting local and public URLs on one card

        Both addresses come from Uptime Kuma, from **how you name the
        monitors**. Give a service two monitors:

        | Monitor name | Points at | Shows on the card as |
        | --- | --- | --- |
        | `Plex` | your public URL | **External** |
        | `Plex local` | your LAN URL | **Local** |

        Service Dash pairs them by name into a single card carrying both.
        `Plex (local)`, `Plex - local` and `Plex.local` are recognised the same
        way. A service with only one monitor simply shows one address.

        Each address is the monitor's own URL in Kuma, so it is set in Kuma, not
        here. The dashboard opens whichever address your browser can actually
        reach -- the local one when you are on the LAN, the public one when you
        are not -- deciding per card and without testing anything. The switch in
        the top bar pins it to **Local** or **External** if you would rather
        choose yourself.

        Both addresses read **URL Locked** until you sign in to Uptime Kuma from
        the dashboard -- signed out, they are never sent to the browser at all.

        Then open Service Dash on port **8888**.
  release_notes:
    en_US: |
      1.5.1 makes the AI usage panel actually reachable on ZimaOS. 1.5.0
      shipped its two reporters behind a Compose profile, and CasaOS silently
      drops any service that declares one -- so the panel could not be turned
      on at all, by update or by fresh install. They are now ordinary services
      that sit idle until you sign in, so enabling the feature is just:

        sudo docker exec -it service-dash-claude-usage claude auth login

      Idle they cost about 12MB of RAM and no measurable CPU. The trade is
      disk: both images carry a vendor CLI and are pulled whether or not you
      use them.

      Also in this cycle, from 1.5.0: the AI usage panel itself -- how much of
      your Claude and ChatGPT plan is left, as dials above the grid -- plus a
      fix for iPhone Safari killing the tab after a few minutes of scrolling,
      and dialogs no longer running under the notch.
