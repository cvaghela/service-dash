name: service-dash

services:
  service-dash:
    image: ghcr.io/cvaghela/service-dash:1.1.0
    container_name: service-dash
    ports:
      - "8888:80"
    environment:
      KUMA_PORT: "3001"
      STATUS_SLUG: "homelab"
      STORAGE_MOUNT: "auto"
      # Optional: override the auto-picked icon for a service, by its card name.
      # An empty value keeps that card on its category emoji.
      SERVICE_ICONS: '{}'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - netdata
      - docker-metadata
      - network-info
    volumes:
      - type: bind
        source: /DATA/AppData/service-dash/network-info
        target: /var/run/network-info
        read_only: true
    networks:
      service-dash-network:
        aliases:
          - service-dash
    restart: unless-stopped

  network-info:
    image: ghcr.io/cvaghela/service-dash-network-info:1.1.0
    container_name: service-dash-network-info
    network_mode: host
    read_only: true
    environment:
      NETWORK_INFO_REFRESH_SECONDS: "600"
    volumes:
      - type: bind
        source: /DATA/AppData/service-dash/network-info
        target: /status
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "test", "-s", "/status/status.json"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  docker-metadata:
    image: ghcr.io/hectorm/cetusguard:v1
    container_name: service-dash-docker-metadata
    read_only: true
    environment:
      CETUSGUARD_BACKEND_ADDR: unix:///var/run/docker.sock
      CETUSGUARD_FRONTEND_ADDR: tcp://0.0.0.0:2375
      CETUSGUARD_RULES: |
        GET %API_PREFIX_NETWORKS%(\?.*)?
        GET %API_PREFIX_NETWORKS%/%NETWORK_ID_OR_NAME%(\?.*)?
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      service-dash-network:
        aliases:
          - docker-metadata
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  netdata:
    image: netdata/netdata:stable
    container_name: service-dash-netdata
    pid: host
    environment:
      DISABLE_TELEMETRY: "1"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - /DATA/AppData/service-dash/netdata/config:/etc/netdata
      - /DATA/AppData/service-dash/netdata/lib:/var/lib/netdata
      - /DATA/AppData/service-dash/netdata/cache:/var/cache/netdata
      - /DATA:/host/root/DATA:ro,rslave
      - /etc/hostname:/host/etc/hostname:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/dbus:/run/dbus:ro
    networks:
      service-dash-network:
        aliases:
          - netdata
    restart: unless-stopped

networks:
  service-dash-network:
    name: service-dash-network
    driver: bridge

x-casaos:
  architectures:
    - amd64
  main: service-dash
  category: Utilities
  description:
    en_us: Glass dashboard with an embedded Netdata Agent for host metrics
  icon: https://i.postimg.cc/BnL4qBwB/service-dash.png
  index: /
  port_map: "8888"
  scheme: http
  store_app_id: service-dash
  title:
    en_us: Service Dash
