name: service-dash

services:
  service-dash:
    image: ghcr.io/cvaghela/service-dash:1.2.1
    container_name: service-dash
    ports:
      - "8888:80"
    environment:
      KUMA_PORT: "3001"
      STATUS_SLUG: "homelab"
      STORAGE_MOUNT: "auto"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - netdata
      - docker-metadata
      - network-info
      - kuma-auth
    volumes:
      - type: bind
        source: /DATA/AppData/service-dash/network-info
        target: /var/run/network-info
        read_only: true
      # Holds shared card settings. Only written when SHARED_SETTINGS is "on".
      - type: bind
        source: /DATA/AppData/service-dash/settings
        target: /var/lib/service-dash
    networks:
      service-dash-network:
        aliases:
          - service-dash
    restart: unless-stopped

  # Answers one question for nginx: is this browser really signed in to Uptime
  # Kuma? Without it, saving settings would have to trust the browser's word.
  kuma-auth:
    image: ghcr.io/cvaghela/service-dash-kuma-auth:1.2.1
    container_name: service-dash-kuma-auth
    environment:
      # Must point at the same Uptime Kuma as KUMA_PORT above.
      KUMA_URL: "http://host.docker.internal:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Must share a network with service-dash: nginx reaches this by service name.
    networks:
      service-dash-network:
        aliases:
          - kuma-auth
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:2371/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  network-info:
    image: ghcr.io/cvaghela/service-dash-network-info:1.2.1
    container_name: service-dash-network-info
    network_mode: host
    read_only: true
    environment:
      # Starting value only — the dashboard's settings page overrides it.
      NETWORK_INFO_REFRESH_SECONDS: "600"
    volumes:
      - type: bind
        source: /DATA/AppData/service-dash/network-info
        target: /status
      # Read-only: the refresh interval is set on the dashboard's settings page.
      - type: bind
        source: /DATA/AppData/service-dash/settings
        target: /settings
        read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "test", "-s", "/status/status.json"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  docker-metadata:
    image: ghcr.io/hectorm/cetusguard:v1
    container_name: service-dash-docker-metadata
    read_only: true
    environment:
      CETUSGUARD_BACKEND_ADDR: unix:///var/run/docker.sock
      CETUSGUARD_FRONTEND_ADDR: tcp://0.0.0.0:2375
      CETUSGUARD_RULES: |
        GET %API_PREFIX_NETWORKS%(\?.*)?
        GET %API_PREFIX_NETWORKS%/%NETWORK_ID_OR_NAME%(\?.*)?
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      service-dash-network:
        aliases:
          - docker-metadata
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  netdata:
    image: netdata/netdata:stable
    container_name: service-dash-netdata
    pid: host
    environment:
      DISABLE_TELEMETRY: "1"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - /DATA/AppData/service-dash/netdata/config:/etc/netdata
      - /DATA/AppData/service-dash/netdata/lib:/var/lib/netdata
      - /DATA/AppData/service-dash/netdata/cache:/var/cache/netdata
      - /DATA:/host/root/DATA:ro,rslave
      - /etc/hostname:/host/etc/hostname:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/dbus:/run/dbus:ro
    networks:
      service-dash-network:
        aliases:
          - netdata
    restart: unless-stopped

networks:
  service-dash-network:
    name: service-dash-network
    driver: bridge

x-casaos:
  architectures:
    - amd64
  main: service-dash
  category: Utilities
  description:
    en_us: Glass dashboard with an embedded Netdata Agent for host metrics
  icon: https://i.postimg.cc/BnL4qBwB/service-dash.png
  index: /
  port_map: "8888"
  scheme: http
  store_app_id: service-dash
  title:
    en_us: Service Dash
