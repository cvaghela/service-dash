name: service-dash

services:
  service-dash:
    image: ghcr.io/cvaghela/service-dash:1.1.1
    container_name: service-dash
    ports:
      # Change 8888 only when a different host port is required.
      - "8888:80"
    environment:
      # User configuration: edit these values directly when defaults differ.
      KUMA_PORT: "3001"
      STATUS_SLUG: "homelab"
      # Use "auto" or an exact mount path reported by Netdata, such as "/",
      # "/DATA", "/media/1TB-SSD-1", or "/mnt/storage".
      STORAGE_MOUNT: "auto"
      # Optional: override the auto-picked icon for a service, by its card name.
      # An empty value keeps that card on its category emoji.
      SERVICE_ICONS: '{}'
      # "on" shares card settings, filters and notes across every browser and
      # device, by keeping them in the settings volume below instead of in each
      # browser. Reading stays open; saving a change requires the password
      # below, so a visitor cannot rewrite what everyone else sees.
      SHARED_SETTINGS: "off"
      SHARED_SETTINGS_USER: "dashboard"
      # Required when SHARED_SETTINGS is "on" — the container refuses to start
      # without it. A file keeps the secret out of `docker inspect`; create it
      # with, for example:
      #   printf '%s' 'a-long-random-passphrase' > ./settings-password.txt
      #   chmod 600 ./settings-password.txt
      SHARED_SETTINGS_PASSWORD_FILE: "/run/secrets/settings_password"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      netdata:
        condition: service_healthy
      docker-metadata:
        condition: service_started
      network-info:
        condition: service_healthy
    volumes:
      - networkinfo:/var/run/network-info:ro
      # Holds shared card settings. Only written when SHARED_SETTINGS is "on".
      - settings:/var/lib/service-dash
    secrets:
      - settings_password
    restart: unless-stopped

  network-info:
    image: ghcr.io/cvaghela/service-dash-network-info:1.1.1
    container_name: service-dash-network-info
    network_mode: host
    read_only: true
    environment:
      NETWORK_INFO_REFRESH_SECONDS: "600"
    volumes:
      - networkinfo:/status
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "test", "-s", "/status/status.json"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  docker-metadata:
    image: ghcr.io/hectorm/cetusguard:v1
    container_name: service-dash-docker-metadata
    read_only: true
    environment:
      CETUSGUARD_BACKEND_ADDR: unix:///var/run/docker.sock
      CETUSGUARD_FRONTEND_ADDR: tcp://0.0.0.0:2375
      CETUSGUARD_RULES: |
        GET %API_PREFIX_NETWORKS%(\?.*)?
        GET %API_PREFIX_NETWORKS%/%NETWORK_ID_OR_NAME%(\?.*)?
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  netdata:
    image: netdata/netdata:stable
    container_name: service-dash-netdata
    pid: host
    environment:
      DISABLE_TELEMETRY: "1"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/hostname:/host/etc/hostname:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped

volumes:
  networkinfo:
  settings:

secrets:
  settings_password:
    # Only read when SHARED_SETTINGS is "on". Keep this file out of version
    # control — add it to .gitignore if you create it here.
    file: ./settings-password.txt
  netdataconfig:
  netdatalib:
  netdatacache:

x-casaos:
  architectures:
    - amd64
  main: service-dash
  category: Utilities
  description:
    en_us: Glass dashboard with an embedded Netdata Agent for host metrics
  icon: https://i.postimg.cc/BnL4qBwB/service-dash.png
  index: /
  port_map: "8888"
  scheme: http
  store_app_id: service-dash
  title:
    en_us: Service Dash
